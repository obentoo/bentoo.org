# rolldown >= 1.2.19 lists @rolldown/binding-wasm32-wasi again; that binding pins
# @emnapi/{core,runtime} 2.0.0-beta.2, and pnpm then hands the beta runtime to
# @astrojs/astro2tsx's @napi-rs/wasm-runtime peer next to @emnapi/core 1.11.3 --
# `astro check` dies with `this.bridge.setLastError is not a function`. The binding
# only installs on cpu=wasm32, which no build or CI host here is.
ignoredOptionalDependencies:
  - '@rolldown/binding-wasm32-wasi'

# Install scripts allowed (true) or denied (false). pnpm 12 fails the install
# on any dependency with a build script that is not listed here.
# workerd is denied: only wrangler's local runtime needs its binary, never the build.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: false

# Vulnerable transitives the direct upgrades do not reach. Each entry is scoped
# to the vulnerable major and pinned to the lowest patched release that is at
# least seven days old; its comment names the advisories it closes.
overrides:
